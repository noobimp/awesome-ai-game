<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome AI Game</title>
    <meta name="description" content="开源 AI HTML 游戏收录。提交后会变成 GitHub Pull Request，合并后在网站和仓库里展示。">
    <style>
        :root {
            --bg: #07080d;
            --bg-2: rgba(16, 18, 28, 0.82);
            --line: rgba(255, 255, 255, 0.12);
            --text: #f6f3ea;
            --muted: #9b978c;
            --lime: #d6ff3f;
            --cyan: #3de0ff;
            --magenta: #ff3d8a;
            --danger: #ff6b5a;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .stage {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background:
                radial-gradient(900px 420px at 8% -10%, rgba(214, 255, 63, 0.16), transparent 60%),
                radial-gradient(700px 480px at 100% 0%, rgba(255, 61, 138, 0.18), transparent 55%),
                radial-gradient(800px 500px at 70% 110%, rgba(61, 224, 255, 0.12), transparent 50%),
                var(--bg);
        }
        .stage::before {
            content: "";
            position: absolute;
            inset: -20%;
            background:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 72px 72px;
            transform: perspective(500px) rotateX(62deg) translateY(18%);
            mask-image: linear-gradient(to top, #000 10%, transparent 72%);
            animation: drift 22s linear infinite;
        }
        .stage::after {
            content: "";
            position: absolute;
            width: 42vw;
            height: 42vw;
            left: -8vw;
            top: -12vw;
            background: radial-gradient(circle, rgba(214, 255, 63, 0.22), transparent 68%);
            filter: blur(8px);
            animation: pulse 9s ease-in-out infinite;
        }
        a { color: inherit; }
        .wrap { width: min(1180px, calc(100% - 32px)); margin: 0 auto; position: relative; z-index: 1; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 24px;
            padding: 42px 0 8px;
        }
        .mark {
            font-size: 12px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--lime);
            margin: 0 0 12px;
            text-shadow: 0 0 18px rgba(214, 255, 63, 0.45);
        }
        h1 {
            font-family: Impact, "Arial Black", "PingFang SC", sans-serif;
            font-size: clamp(52px, 8vw, 92px);
            line-height: 0.84;
            margin: 0;
            font-weight: 400;
            letter-spacing: -0.03em;
            background: linear-gradient(100deg, #fff 10%, var(--lime) 42%, var(--cyan) 78%, var(--magenta));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 10px 30px rgba(61, 224, 255, 0.18));
        }
        header p { margin: 16px 0 0; color: var(--muted); max-width: 480px; }
        .github {
            border: 1px solid transparent;
            padding: 11px 16px;
            border-radius: 999px;
            text-decoration: none;
            color: var(--text);
            white-space: nowrap;
            background:
                linear-gradient(var(--bg), var(--bg)) padding-box,
                linear-gradient(120deg, var(--lime), var(--cyan), var(--magenta)) border-box;
            box-shadow: 0 0 24px rgba(61, 224, 255, 0.18);
        }
        .github:hover { box-shadow: 0 0 28px rgba(214, 255, 63, 0.35); }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 28px 0 18px; }
        .search, select, input, textarea {
            background: rgba(12, 14, 22, 0.9);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
            font: inherit;
        }
        .search { flex: 1; min-width: 220px; }
        .search:focus, input:focus, textarea:focus { outline: 2px solid var(--lime); border-color: transparent; }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .chip, .btn {
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.03);
            color: var(--text);
            border-radius: 999px;
            padding: 10px 14px;
            cursor: pointer;
            font: inherit;
        }
        .chip.on, .btn.primary {
            background: var(--lime);
            color: #14160a;
            border-color: var(--lime);
            font-weight: 700;
            box-shadow: 0 0 18px rgba(214, 255, 63, 0.28);
        }
        .chip:hover, .btn:hover { border-color: rgba(255,255,255,0.4); }
        .fx { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 8px 0 48px; }
        .card {
            background: var(--bg-2);
            border: 1px solid var(--line);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(8px);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(214, 255, 63, 0.55);
            box-shadow: 0 16px 40px rgba(0,0,0,0.35), 0 0 24px rgba(61, 224, 255, 0.12);
        }
        .card img { width: 100%; aspect-ratio: 16/9; object-fit: contain; object-position: center; background: #07080d; display: block; }
        .card .body { padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .card h3 { font-size: 18px; margin: 0; }
        .meta { color: var(--muted); font-size: 13px; }
        .actions { display: flex; gap: 8px; margin-top: auto; }
        .actions a, .actions button { flex: 1; text-align: center; text-decoration: none; }
        .empty { color: var(--muted); padding: 48px 0 80px; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 5; }
        .overlay.on { display: flex; }
        .modal { width: min(680px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: #12141c; border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 0; box-shadow: 0 24px 80px rgba(0,0,0,0.5); }
        .modal h2 { margin: 0 0 6px; font-family: Impact, "Arial Black", "PingFang SC", sans-serif; letter-spacing: 0.02em; font-weight: 400; font-size: 32px; }
        .detail img { display: block; width: auto; max-width: 100%; height: auto; max-height: 70vh; margin: 0 auto; object-fit: contain; object-position: center; background: #07080d; border-radius: 12px; }
        .detail dt { color: var(--cyan); font-size: 12px; letter-spacing: 0.08em; margin-top: 12px; }
        .detail dd { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; }
        .row { display: flex; justify-content: flex-end; gap: 8px; position: sticky; bottom: 0; margin: 8px -18px 0; padding: 12px 18px; background: #12141c; border-top: 1px solid var(--line); }
        footer { color: var(--muted); padding: 8px 0 40px; font-size: 13px; }
        footer a { color: var(--lime); }
        @media (max-width: 720px) {
            header { flex-direction: column; align-items: flex-start; }
        }
        @media (prefers-reduced-motion: reduce) {
            .stage::before, .stage::after, .card { animation: none; transition: none; }
        }
        @keyframes drift {
            from { background-position: 0 0, 0 0; }
            to { background-position: 0 72px, 72px 0; }
        }
        @keyframes pulse {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(8vw, 4vh, 0); }
        }
    </style>
</head>
<body>
    <div class="stage" aria-hidden="true"></div>
    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    <div class="wrap">
        <header>
            <div>
                <p class="mark">awesome-ai-game.site</p>
                <h1>AWESOME<br>AI GAME</h1>
                <p>最近的开源 AI HTML 游戏。挑一个，复制 prompt，在浏览器里直接玩。</p>
            </div>
            <a class="github" href="https://github.com/noobimp/awesome-ai-game">GitHub</a>
        </header>
        <div class="toolbar">
            <input class="search" id="q" type="search" placeholder="搜索游戏、作者、模型、prompt">
            <div class="chips" id="chips"></div>
        </div>
        <div class="grid" id="grid"></div>
        <p class="empty" id="empty" hidden>没有匹配的游戏。</p>
        <footer>游戏版权归作者。感兴趣，或想贡献，请到 <a href="https://github.com/noobimp/awesome-ai-game/pulls">GitHub</a> 提交 Pull Request。</footer>
    </div>

    <div class="overlay" id="detailOverlay">
        <div class="modal detail" id="detail"></div>
    </div>

    <script>
        const state = { games: [], category: "全部" };

        async function load() {
            const response = await fetch("data/games.json");
            state.games = await response.json();
            renderChips();
            render();
        }

        function categories() {
            return ["全部", ...new Set(state.games.map((game) => game.category))];
        }

        function renderChips() {
            const box = document.getElementById("chips");
            box.replaceChildren();
            for (const name of categories()) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "chip" + (name === state.category ? " on" : "");
                button.textContent = name;
                button.addEventListener("click", () => {
                    state.category = name;
                    renderChips();
                    render();
                });
                box.append(button);
            }
        }

        function query() {
            return document.getElementById("q").value.trim().toLowerCase();
        }

        function matches(game) {
            if (state.category !== "全部" && game.category !== state.category) return false;
            const q = query();
            if (!q) return true;
            return [game.name, game.author, game.model, game.prompt, game.category, game.stack].join("\n").toLowerCase().includes(q);
        }

        function metaLine(game) {
            return "@" + game.author.replace(/^@/, "") + " · " + (game.model || game.stack);
        }

        function card(game) {
            const article = document.createElement("article");
            article.className = "card";
            const img = document.createElement("img");
            img.src = game.screenshot;
            img.alt = game.name;
            const body = document.createElement("div");
            body.className = "body";
            const title = document.createElement("h3");
            title.textContent = game.name;
            const meta = document.createElement("div");
            meta.className = "meta";
            meta.textContent = metaLine(game);
            const actions = document.createElement("div");
            actions.className = "actions";
            const play = document.createElement("a");
            play.className = "btn primary";
            play.href = game.game_url;
            play.target = "_blank";
            play.rel = "noreferrer";
            play.textContent = "开始玩";
            const more = document.createElement("button");
            more.className = "btn";
            more.type = "button";
            more.textContent = "详情";
            more.addEventListener("click", () => openDetail(game));
            actions.append(play, more);
            body.append(title, meta, actions);
            article.append(img, body);
            return article;
        }

        function render() {
            const found = state.games.filter(matches);
            document.getElementById("empty").hidden = found.length !== 0;
            document.getElementById("grid").replaceChildren(...found.map(card));
        }

        function startParticles() {
            const canvas = document.getElementById("fx");
            const ctx = canvas.getContext("2d");
            const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            const colors = ["rgba(214,255,63,", "rgba(61,224,255,", "rgba(255,61,138,"];
            let w = 0;
            let h = 0;
            let dots = [];
            function layout() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
                const count = Math.max(40, Math.min(90, Math.round(w / 18)));
                dots = Array.from({ length: count }, () => ({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 1.7 + 0.4,
                    vx: (Math.random() - 0.5) * 0.42,
                    vy: (Math.random() - 0.5) * 0.42,
                    c: colors[Math.floor(Math.random() * colors.length)],
                    a: Math.random() * 0.5 + 0.2
                }));
            }
            layout();
            window.addEventListener("resize", layout);
            function tick() {
                ctx.clearRect(0, 0, w, h);
                for (let i = 0; i < dots.length; i++) {
                    const p = dots[i];
                    if (!reduce) {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < 0 || p.x > w) p.vx *= -1;
                        if (p.y < 0 || p.y > h) p.vy *= -1;
                    }
                    ctx.beginPath();
                    ctx.fillStyle = p.c + p.a + ")";
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                    for (let j = i + 1; j < dots.length; j++) {
                        const q = dots[j];
                        const dx = p.x - q.x;
                        const dy = p.y - q.y;
                        const dist = dx * dx + dy * dy;
                        if (dist < 150 * 150) {
                            ctx.strokeStyle = "rgba(214,255,63," + ((1 - dist / (150 * 150)) * 0.16) + ")";
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(q.x, q.y);
                            ctx.stroke();
                        }
                    }
                }
                if (!reduce) requestAnimationFrame(tick);
            }
            tick();
        }
        startParticles();

        function openDetail(game) {
            const box = document.getElementById("detail");
            box.replaceChildren();
            const title = document.createElement("h2");
            title.textContent = game.name;
            const img = document.createElement("img");
            img.src = game.screenshot;
            img.alt = game.name;
            const list = document.createElement("dl");
            const rows = [
                ["作者", "@" + game.author.replace(/^@/, "")],
                ["分类", game.category],
                ["模型", game.model],
                ["技术", game.stack],
                ["预算", game.budget],
                ["项目", game.project_url],
                ["游戏", game.game_url],
                ["对话", game.conversation_url],
                [game.prompt_kind === "described" ? "说明" : "Prompt", game.prompt_kind === "described" && !game.prompt ? "作者没有公开单条 prompt" : game.prompt]
            ];
            for (const [key, value] of rows) {
                if (!value) continue;
                const dt = document.createElement("dt");
                dt.textContent = key;
                const dd = document.createElement("dd");
                dd.textContent = value;
                list.append(dt, dd);
            }
            const row = document.createElement("div");
            row.className = "row";
            const close = document.createElement("button");
            close.className = "btn";
            close.type = "button";
            close.textContent = "关闭";
            close.addEventListener("click", () => document.getElementById("detailOverlay").classList.remove("on"));
            const play = document.createElement("a");
            play.className = "btn primary";
            play.href = game.game_url;
            play.target = "_blank";
            play.rel = "noreferrer";
            play.textContent = "开始玩";
            row.append(close, play);
            box.append(title, row, img, list);
            document.getElementById("detailOverlay").classList.add("on");
        }

        document.getElementById("q").addEventListener("input", render);
        document.getElementById("detailOverlay").addEventListener("click", (event) => {
            if (event.target.id === "detailOverlay") event.currentTarget.classList.remove("on");
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") document.getElementById("detailOverlay").classList.remove("on");
        });
        load().catch(() => {
            document.getElementById("empty").hidden = false;
            document.getElementById("empty").textContent = "没有读到 data/games.json。";
        });
    </script>
</body>
</html>
